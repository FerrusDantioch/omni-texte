name: Tests

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    name: Tests Playwright
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Installer les dépendances de test
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests Playwright
        run: npx playwright test

      - name: Sauvegarder les captures et traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-playwright
          path: tests/resultats/
          retention-days: 7
